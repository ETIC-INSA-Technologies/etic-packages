[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "etic-insa-auth"
# Même numéro que `@etic-insa/auth` : les deux côtés forment un seul contrat, versionné par
# Changesets dans package.json.
dynamic = ["version"]
description = "Connexion des applications ETIC à ETIC Members (FastAPI) : SSO, session serveur, droits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx>=0.28,<0.29",
  "tenacity>=9.2,<10",
  "cryptography>=45,<51",
  "cachetools>=6,<8",
  # Signature du cookie (SessionMiddleware de Starlette).
  "itsdangerous>=2.2,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0.40,<3"]

[project.urls]
Source = "https://github.com/ETIC-INSA-Technologies/etic-packages/tree/main/packages/auth"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  # Client du TestClient de Starlette (httpx y est déprécié).
  "httpx2>=2.13,<3",
  "pytest-asyncio>=1,<2",
  "ruff==0.17.3",
  "sqlalchemy>=2.0.40,<3",
  "pip-audit>=2.9,<3",
]

[tool.hatch.version]
path = "package.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["python/etic_auth"]

[tool.hatch.build.targets.sdist]
include = ["python/etic_auth", "package.json", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# Exceptions nommées en français (`ErreurAuth`), sans suffixe « Error ».
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Dépendances FastAPI en valeur par défaut : les annotations des tests citent des locales.
"python/tests/*" = ["B008"]
