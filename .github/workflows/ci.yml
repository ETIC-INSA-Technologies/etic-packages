name: CI

# Sur main, c'est publication.yml qui appelle ce workflow (workflow_call) : une seule passe des
# contrôles par push, dont dépend la publication des versions.
#
# La PR « Versions des paquets » n'est pas contrôlée : elle ne change que des numéros, des
# CHANGELOG et des changesets supprimés, n'est ouverte ou mise à jour qu'une fois les contrôles
# du commit de main verts, et sa fusion les repasse avant de publier. Un run de CI qu'elle
# déclenche (« en attente d'approbation ») n'a pas à être approuvé : ses jobs ne feraient rien.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Une PR annule sa passe précédente ; appelé par la publication, jamais d'annulation (groupe
# propre à chaque exécution).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Lint, types, tests, build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/installer-node
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Le contenu exact de ce qui serait publié, visible dans le journal.
      - run: npm pack --dry-run --workspaces
      # Seules les dépendances livrées aux applications comptent (le CLI shadcn est en dev).
      - run: npm audit --omit=dev --audit-level=high

  python:
    name: Python — etic-insa-auth
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/auth
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff format --check python
      - run: uv run ruff check python
      - run: uv run pytest -q
      - run: uv build
      # Seules les dépendances livrées aux applications comptent.
      - run: |
          uv export --frozen --no-dev --no-emit-project --all-extras -o "$RUNNER_TEMP/exigences.txt"
          uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/exigences.txt"
