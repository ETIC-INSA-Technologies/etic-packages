name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Le contenu exact de ce qui serait publié, visible dans le journal.
      - run: npm pack --dry-run --workspaces
      # Seules les dépendances livrées aux applications comptent (le CLI shadcn est en dev).
      - run: npm audit --omit=dev --audit-level=high

  python:
    name: Python — etic-insa-auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/auth
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff format --check python
      - run: uv run ruff check python
      - run: uv run pytest -q
      - run: uv build
      # Seules les dépendances livrées aux applications comptent.
      - run: |
          uv export --frozen --no-dev --no-emit-project --all-extras -o "$RUNNER_TEMP/exigences.txt"
          uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/exigences.txt"
